<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidores - Infrastructure Manager</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
    <header>
        <h1> Infrastructure Manager </h1>
    </header>
    <main>
        <nav>
            <a href="../index.html">Dashboard</a>
            <a href="servidores.html">Servidores</a>
            <a href="../index.html">Switches</a>
            <a href="../index.html">Ativos</a>
            <a href="../index.html">Redes</a>
            <a href="../index.html">Incidentes</a>
            <a href="../index.html">Configurações</a>
        </nav>
    
    <section id="gerenciamento-servidores">
        <h2>Gerenciamento de Servidores</h2>
        <p>Visualize e gerencie os servidores cadastrados na infraestrutura.</p>
        
        <form id="formulaario-servidor">
            <h3> Cadastro de Servidor</h3>

            <!-- Campo criado para acrescentar o nome do servidor -->
            <label for="nome-servidor"> Nome do Servidor:</label>
            <input type="text" id="nome-servidor" name="nome" required>

            <!-- Aqui serão cadastrados as informações de IP-->
            <label for="ip-servidor"> Endereço IP:</label>
            <input type="text" id="ip-servidor" name="ip" placeholder="192.168.1.1" required>

        </form>
       
    <table id="tabela-servidores">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Endereço IP</th>
            <th>Sistema Operacional</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="lista-servidores">
    </tbody>
</table> 
    </section>
      
    </main>


    <script src="../js/servidores.js"></script>
</body>
</html>
